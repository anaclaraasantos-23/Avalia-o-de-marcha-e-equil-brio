<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avaliação de Marcha e Equilíbrio</title>
<style>
  :root{
    --bg: #EDF0EA;
    --panel: #FFFFFF;
    --ink: #1E2A28;
    --ink-soft: #4B5750;
    --line: #CBD3C4;
    --line-soft: #DEE3D8;
    --accent: #3F6B52;
    --accent-soft: #E4ECE5;
    --amber: #B98241;
    --amber-soft: #F3E7D5;
    --brick: #A34A3D;
    --serif: ui-serif, Georgia, "Iowan Old Style", "Times New Roman", serif;
    --sans: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    min-height: 100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding: 32px 16px;
  }
  .app{
    width: 100%;
    max-width: 780px;
  }

  /* ---------- Home ---------- */
  .home-head{
    margin-bottom: 28px;
  }
  .home-head h1{
    font-family: var(--serif);
    font-weight: 500;
    font-size: 30px;
    line-height: 1.25;
    margin: 0 0 8px 0;
    color: var(--ink);
  }
  .home-head p{
    margin: 0;
    color: var(--ink-soft);
    font-size: 15px;
    max-width: 52ch;
    line-height: 1.5;
  }
  .scale-grid{
    display:grid;
    gap: 14px;
  }
  .scale-card{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 20px 22px;
    text-align: left;
    cursor: pointer;
    display:flex;
    flex-direction:column;
    gap: 6px;
    transition: border-color .15s ease, transform .1s ease;
    font-family: var(--sans);
  }
  .scale-card:hover{ border-color: var(--accent); }
  .scale-card:active{ transform: scale(0.99); }
  .scale-card h2{
    font-family: var(--serif);
    font-size: 19px;
    font-weight: 500;
    margin: 0;
    color: var(--ink);
  }
  .scale-card .meta{
    font-size: 13px;
    color: var(--ink-soft);
  }
  .scale-card .desc{
    font-size: 14px;
    color: var(--ink-soft);
    line-height: 1.45;
  }
  .scale-card.disabled{
    cursor: default;
    opacity: 0.6;
    border-style: dashed;
  }
  .scale-card.disabled:hover{ border-color: var(--line); }

  /* ---------- Flow header ---------- */
  .flow-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom: 18px;
    gap: 12px;
  }
  .flow-title{
    font-family: var(--serif);
    font-size: 17px;
    color: var(--ink);
  }
  .flow-count{
    font-size: 13px;
    color: var(--ink-soft);
    white-space: nowrap;
  }
  .progress-track{
    height: 4px;
    background: var(--line-soft);
    border-radius: 2px;
    overflow:hidden;
    margin-bottom: 30px;
  }
  .progress-fill{
    height:100%;
    background: var(--accent);
    transition: width .25s ease;
  }

  /* ---------- Question card ---------- */
  .q-card{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 26px 26px 22px 26px;
  }
  .q-section-tag{
    font-size: 12.5px;
    color: var(--accent);
    font-weight: 600;
    margin-bottom: 6px;
  }
  .q-name{
    font-family: var(--serif);
    font-size: 22px;
    font-weight: 500;
    margin: 0 0 10px 0;
    color: var(--ink);
  }
  .q-instructions{
    font-size: 14.5px;
    color: var(--ink-soft);
    line-height: 1.55;
    margin: 0 0 22px 0;
    font-style: italic;
    border-left: 2px solid var(--line);
    padding-left: 12px;
  }

  .group-block + .group-block{
    margin-top: 22px;
    padding-top: 20px;
    border-top: 1px solid var(--line-soft);
  }
  .group-label{
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 10px;
  }

  .options{
    display:flex;
    flex-direction: column;
    gap: 9px;
  }
  .opt-btn{
    text-align:left;
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 4px solid var(--line);
    border-radius: 8px;
    padding: 12px 14px;
    cursor: pointer;
    font-family: var(--sans);
    display:flex;
    flex-direction: column;
    gap: 2px;
    transition: border-color .12s ease, background .12s ease;
  }
  .opt-btn:hover{ background: var(--accent-soft); border-color: var(--accent); }
  .opt-btn.selected{ background: var(--accent-soft); border-color: var(--accent); border-left-color: var(--accent); }
  .opt-btn .opt-label{
    font-size: 15px;
    font-weight: 600;
    color: var(--ink);
  }
  .opt-btn .opt-desc{
    font-size: 13px;
    color: var(--ink-soft);
    line-height: 1.4;
  }
  .opt-btn.sev-0{ border-left-color: var(--brick); }
  .opt-btn.sev-1{ border-left-color: var(--amber); }

  .binary-row{
    display:flex;
    gap: 9px;
  }
  .binary-row .opt-btn{ flex:1; }

  .flow-actions{
    display:flex;
    justify-content: space-between;
    align-items:center;
    margin-top: 20px;
  }
  .link-btn{
    background:none;
    border:none;
    color: var(--ink-soft);
    font-family: var(--sans);
    font-size: 14px;
    cursor:pointer;
    padding: 8px 4px;
  }
  .link-btn:hover{ color: var(--ink); }
  .primary-btn{
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 11px 20px;
    font-family: var(--sans);
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .primary-btn:disabled{
    background: var(--line);
    cursor: not-allowed;
  }
  .primary-btn:not(:disabled):hover{ opacity: 0.92; }

  /* ---------- Results ---------- */
  .results-card{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 30px 28px;
  }
  .results-card h2{
    font-family: var(--serif);
    font-size: 21px;
    font-weight: 500;
    margin: 0 0 20px 0;
  }
  .score-row{
    display:flex;
    align-items:baseline;
    gap: 10px;
    margin-bottom: 8px;
  }
  .score-row .big{
    font-family: var(--serif);
    font-size: 44px;
    color: var(--amber);
    line-height:1;
  }
  .score-row .of{
    font-size: 16px;
    color: var(--ink-soft);
  }
  .score-row .sub-label{
    font-size: 14px;
    color: var(--ink-soft);
    margin-right: auto;
  }
  .subtotals{
    display:flex;
    gap: 22px;
    margin: 18px 0 6px 0;
    padding: 16px 0;
    border-top: 1px solid var(--line-soft);
    border-bottom: 1px solid var(--line-soft);
  }
  .subtotal-item .n{
    font-family: var(--serif);
    font-size: 24px;
    color: var(--ink);
  }
  .subtotal-item .l{
    font-size: 12.5px;
    color: var(--ink-soft);
  }
  .note-box{
    background: var(--amber-soft);
    border: 1px solid var(--amber);
    border-radius: 8px;
    padding: 13px 15px;
    font-size: 13.5px;
    color: var(--ink);
    line-height: 1.5;
    margin-top: 18px;
  }
  .item-breakdown{
    margin-top: 20px;
  }
  .item-breakdown summary{
    cursor:pointer;
    font-size: 14px;
    color: var(--ink-soft);
    margin-bottom: 10px;
  }
  .item-row{
    display:flex;
    justify-content: space-between;
    gap: 10px;
    padding: 7px 0;
    border-bottom: 1px solid var(--line-soft);
    font-size: 13.5px;
  }
  .item-row .name{ color: var(--ink); }
  .item-row .val{ color: var(--ink-soft); white-space: nowrap; }
  .results-actions{
    display:flex;
    gap: 10px;
    margin-top: 24px;
  }
  .ghost-btn{
    background: none;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 16px;
    font-family: var(--sans);
    font-size: 14px;
    cursor: pointer;
    color: var(--ink);
  }
  .ghost-btn:hover{ border-color: var(--accent); color: var(--accent); }

  /* ---------- Paciente / Histórico ---------- */
  .patient-box{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px 18px;
    margin-bottom: 22px;
  }
  .patient-fields-row{
    display:flex;
    gap: 14px;
    flex-wrap: wrap;
  }
  .patient-field{
    flex: 1;
    min-width: 200px;
  }
  .patient-field-cpf{
    flex: 0 0 200px;
  }
  .patient-label{
    display:block;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-soft);
    margin-bottom: 8px;
  }
  .patient-input-row{
    display:flex;
    gap: 10px;
    align-items:center;
  }
  .patient-input{
    width: 100%;
    font-family: var(--sans);
    font-size: 15px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--ink);
    background: var(--bg);
  }
  .patient-input:focus{ outline: none; border-color: var(--accent); }
  .patient-input.input-error{ border-color: var(--brick); }
  .history-link{ white-space: nowrap; }
  .patient-box-footer{
    display:flex;
    justify-content: space-between;
    align-items:center;
    gap: 12px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .patient-hint{
    font-size: 12.5px;
    color: var(--ink-soft);
  }
  .history-filter-row{ margin-bottom: 16px; }
  .history-card{ padding: 10px 0; }
  .history-list{ display:flex; flex-direction:column; }
  .history-item{
    display:flex;
    justify-content: space-between;
    align-items:center;
    gap: 12px;
    padding: 14px 24px;
    border-bottom: 1px solid var(--line-soft);
  }
  .history-item:last-child{ border-bottom:none; }
  .history-item-main{ font-size: 14.5px; color: var(--ink); }
  .history-item-main strong{ font-weight: 600; }
  .history-item-meta{
    font-size: 13px;
    color: var(--ink-soft);
    white-space: nowrap;
  }
  .history-empty{
    padding: 20px 24px;
    color: var(--ink-soft);
    font-size: 14px;
  }
  .field-error{
    display:none;
    color: var(--brick);
    font-size: 12px;
    margin-top: 6px;
  }
  .field-error.show{ display:block; }
  .history-actions{
    display:flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }
  .history-status{
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 12px;
    min-height: 1em;
  }

  @media (max-width: 520px){
    .q-card{ padding: 20px 18px; }
    .score-row .big{ font-size: 36px; }
    .subtotals{ flex-wrap: wrap; }
  }
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
/* ================= DADOS: DGI ================= */
const DGI = {
  key: 'dgi',
  title: 'Índice de Marcha Dinâmica (DGI)',
  meta: '8 itens · pontuação 0–3 por item · máximo 24',
  desc: 'Avalia a capacidade de ajustar a marcha diante de exigências variáveis (velocidade, cabeça, obstáculos, degraus).',
  maxScore: 24,
  items: [
    { name:'Marcha em superfície plana',
      instructions:'Ande em sua velocidade normal, daqui até a próxima marca (6 metros).',
      groups:[{ options:[
        {label:'Normal', desc:'Anda 6 metros, sem dispositivos de auxílio, em boa velocidade, sem evidência de desequilíbrio, marcha em padrão normal.', value:3},
        {label:'Comprometimento leve', desc:'Anda 6 metros, velocidade lenta, marcha com mínimos desvios, ou utiliza dispositivos de auxílio à marcha.', value:2},
        {label:'Comprometimento moderado', desc:'Anda 6 metros, velocidade lenta, marcha em padrão anormal, evidência de desequilíbrio.', value:1},
        {label:'Comprometimento grave', desc:'Não consegue andar 6 metros sem auxílio, grandes desvios da marcha ou desequilíbrio.', value:0},
      ]}]},
    { name:'Mudança de velocidade da marcha',
      instructions:'Ande no seu passo normal (1,5 metros). Quando eu falar "rápido", ande o mais rápido que puder (1,5 metros). Quando eu falar "devagar", ande o mais devagar que puder (1,5 metros).',
      groups:[{ options:[
        {label:'Normal', desc:'É capaz de alterar a velocidade da marcha sem perda de equilíbrio ou desvios. Mostra diferença significativa nas velocidades normal, rápido e devagar.', value:3},
        {label:'Comprometimento leve', desc:'É capaz de mudar de velocidade mas apresenta discretos desvios da marcha, ou não consegue mudar significativamente a velocidade, ou utiliza um dispositivo de auxílio à marcha.', value:2},
        {label:'Comprometimento moderado', desc:'Só realiza pequenos ajustes na velocidade da marcha, ou consegue mudar a velocidade com importantes desvios na marcha, ou muda de velocidade e perde o equilíbrio, mas consegue recuperá-lo e continuar andando.', value:1},
        {label:'Comprometimento grave', desc:'Não consegue mudar de velocidade, ou perde o equilíbrio e procura apoio na parede, ou necessita ser amparado.', value:0},
      ]}]},
    { name:'Marcha com movimentos horizontais (rotação) da cabeça',
      instructions:'Comece andando no seu passo normal. Quando eu disser "olhe para a direita", vire a cabeça para o lado direito e continue andando para frente até eu diga "olhe para a esquerda"; vire a cabeça para o lado esquerdo e continue andando. Quando eu disser "olhe para a frente", continue andando e volte a olhar para frente.',
      groups:[{ options:[
        {label:'Normal', desc:'Realiza as rotações da cabeça suavemente, sem alteração da marcha.', value:3},
        {label:'Comprometimento leve', desc:'Realiza as rotações da cabeça suavemente, com leve alteração da velocidade da marcha, ou seja, com mínima alteração da progressão da marcha, ou utiliza dispositivo de auxílio à marcha.', value:2},
        {label:'Comprometimento moderado', desc:'Realiza as rotações da cabeça com moderada alteração da velocidade da marcha, diminui a velocidade, ou cambaleia mas recupera e consegue continuar a andar.', value:1},
        {label:'Comprometimento grave', desc:'Realiza a tarefa com grave distúrbio da marcha, ou seja, cambaleando para fora do trajeto (cerca de 38cm), perde o equilíbrio, pára, procura apoio na parede, ou precisa ser amparado.', value:0},
      ]}]},
    { name:'Marcha com movimentos verticais (rotação) da cabeça',
      instructions:'Comece andando no seu passo normal. Quando eu disser "olhe para cima", levante a cabeça e olhe para cima. Continue andando para frente até eu diga "olhe para baixo", então incline a cabeça para baixo e continue andando. Quando eu disser "olhe para frente", continue andando e volte a olhar para frente.',
      groups:[{ options:[
        {label:'Normal', desc:'Realiza as rotações da cabeça sem alteração da marcha.', value:3},
        {label:'Comprometimento leve', desc:'Realiza a tarefa com leve alteração da velocidade da marcha, ou seja, com mínima alteração da progressão da marcha, ou utiliza dispositivo de auxílio à marcha.', value:2},
        {label:'Comprometimento moderado', desc:'Realiza a tarefa com moderada alteração da marcha, diminui a velocidade, ou cambaleia mas consegue continuar a andar.', value:1},
        {label:'Comprometimento grave', desc:'Realiza a tarefa com grave distúrbio da marcha, ou seja, cambaleando para fora do trajeto, perde o equilíbrio, pára, procura apoio na parede, ou precisa ser amparado.', value:0},
      ]}]},
    { name:'Marcha e giro sobre o próprio eixo corporal (pivô)',
      instructions:'Comece andando no seu passo normal. Quando eu disser "vire-se e pare", vire-se o mais rápido que puder para a direção oposta e permaneça parado de frente para (este ponto) seu ponto de partida.',
      groups:[{ options:[
        {label:'Normal', desc:'Gira o corpo com segurança em até 3 segundos e pára rapidamente sem perder o equilíbrio.', value:3},
        {label:'Comprometimento leve', desc:'Gira o corpo com segurança em um tempo maior que 3 segundos e pára sem perder o equilíbrio.', value:2},
        {label:'Comprometimento moderado', desc:'Gira lentamente, precisa de vários passos pequenos até recuperar o equilíbrio após girar ou parar, ou precisa de dicas verbais.', value:1},
        {label:'Comprometimento grave', desc:'Não consegue girar o corpo com segurança, perde o equilíbrio, precisa da ajuda para virar-se e para parar.', value:0},
      ]}]},
    { name:'Passar por cima de obstáculo',
      instructions:'Comece andando no sua velocidade normal. Quando chegar à caixa de sapatos, passe por cima dela, não a contorne, e continue andando.',
      groups:[{ options:[
        {label:'Normal', desc:'É capaz de passar por cima da caixa sem alterar a velocidade da marcha, não há evidência de desequilíbrio.', value:3},
        {label:'Comprometimento leve', desc:'É capaz de passar por cima da caixa, mas precisa diminuir a velocidade da marcha e ajustar os passos para ultrapassá-la com segurança.', value:2},
        {label:'Comprometimento moderado', desc:'É capaz de passar por cima da caixa, mas precisa parar e depois transpor o obstáculo. Pode precisar de dicas verbais.', value:1},
        {label:'Comprometimento grave', desc:'Não consegue realizar a tarefa sem ajuda.', value:0},
      ]}]},
    { name:'Contornar obstáculos',
      instructions:'Comece andando na sua velocidade normal e contorne os cones. Quando chegar no primeiro cone (cerca de 1,8 metros), contorne-o pela direita, continue andando e passe pelo meio deles, ao chegar no segundo cone (cerca de 1,8 m depois do primeiro), contorne-o pela esquerda.',
      groups:[{ options:[
        {label:'Normal', desc:'É capaz de contornar os cones com segurança, sem alteração da velocidade da marcha. Não há evidência de desequilíbrio.', value:3},
        {label:'Comprometimento leve', desc:'É capaz de contornar ambos os cones, mas precisa diminuir o ritmo da marcha e ajustar os passos para não bater nos cones.', value:2},
        {label:'Comprometimento moderado', desc:'É capaz de contornar os cones sem bater neles, mas precisa diminuir significativamente a velocidade da marcha para realizar a tarefa, ou precisa de dicas verbais.', value:1},
        {label:'Comprometimento grave', desc:'É incapaz de contornar os cones; bate em um deles ou em ambos, ou precisa ser amparado.', value:0},
      ]}]},
    { name:'Subir e descer degraus',
      instructions:'Suba estas escadas como você faria em sua casa (ou seja, usando o corrimão, se necessário). Quando chegar ao topo, vire-se e desça.',
      groups:[{ options:[
        {label:'Normal', desc:'Alterna os pés, usa ou não usa o corrimão.', value:3},
        {label:'Comprometimento leve', desc:'Alterna os pés, mas precisa usar o corrimão.', value:2},
        {label:'Comprometimento moderado', desc:'Coloca os dois pés em cada degrau; precisa usar o corrimão.', value:1},
        {label:'Comprometimento grave', desc:'Não consegue realizar a tarefa com segurança.', value:0},
      ]}]},
  ]
};

/* ================= DADOS: TINETTI / POMA-BRASIL ================= */
const TINETTI = {
  key:'tinetti',
  title:'Escala de Equilíbrio e Marcha de Tinetti (POMA-Brasil)',
  meta:'16 itens · equilíbrio /16 + marcha /12 · máximo 28',
  desc:'Avalia condições de equilíbrio e marcha da pessoa idosa. Adaptada para a população brasileira (POMA-Brasil).',
  maxScore: 28,
  items:[
    // ---- EQUILÍBRIO ----
    { section:'equilibrio', name:'1. Equilíbrio sentado', instructions:'Pessoa sentada em uma cadeira sem braços.',
      groups:[{ options:[
        {label:'Escorrega', desc:'', value:0},
        {label:'Equilibrado', desc:'', value:1},
      ]}]},
    { section:'equilibrio', name:'2. Levantar', instructions:'Peça para a pessoa se levantar da cadeira.',
      groups:[{ options:[
        {label:'Incapaz', desc:'', value:0},
        {label:'Utiliza os braços como apoio', desc:'', value:1},
        {label:'Levanta-se sem apoiar os braços', desc:'', value:2},
      ]}]},
    { section:'equilibrio', name:'3. Tentativas para levantar', instructions:'',
      groups:[{ options:[
        {label:'Incapaz', desc:'', value:0},
        {label:'Mais de uma tentativa', desc:'', value:1},
        {label:'Tentativa única', desc:'', value:2},
      ]}]},
    { section:'equilibrio', name:'4. Assim que levanta', instructions:'Primeiros 5 segundos após levantar-se.',
      groups:[{ options:[
        {label:'Desequilibrado', desc:'', value:0},
        {label:'Estável, mas utiliza suporte', desc:'', value:1},
        {label:'Estável sem suporte', desc:'', value:2},
      ]}]},
    { section:'equilibrio', name:'5. Equilíbrio em pé', instructions:'',
      groups:[{ options:[
        {label:'Desequilibrado', desc:'', value:0},
        {label:'Com suporte ou pés afastados (base de sustentação) > 12 cm', desc:'', value:1},
        {label:'Sem suporte e com base estreita', desc:'', value:2},
      ]}]},
    { section:'equilibrio', name:'6. Teste dos três tempos', instructions:'O examinador empurra levemente o esterno da pessoa, que deve estar com os pés juntos.',
      groups:[{ options:[
        {label:'Começa a cair', desc:'', value:0},
        {label:'Agarra ou balança os braços', desc:'', value:1},
        {label:'Equilibrado', desc:'', value:2},
      ]}]},
    { section:'equilibrio', name:'7. Olhos fechados', instructions:'Pessoa em pé, com os pés juntos e olhos fechados.',
      groups:[{ options:[
        {label:'Desequilibrado, instável', desc:'', value:0},
        {label:'Equilibrado', desc:'', value:1},
      ]}]},
    { section:'equilibrio', name:'8. Girando 360º', instructions:'',
      groups:[{ options:[
        {label:'Passos descontínuos', desc:'', value:0},
        {label:'Instável (desequilíbrios)', desc:'', value:1},
        {label:'Estável (equilibrado)', desc:'', value:2},
      ]}]},

const SCALES = { dgi: DGI, tinetti: TINETTI, berg: BERG };

/* ================= ESTADO ================= */
let state = {
  screen: 'home',      // 'home' | 'flow' | 'results' | 'history'
  scaleKey: null,
  itemIndex: 0,
  answers: [],          // por item: array de valores escolhidos por grupo (ou null)
  patientName: '',
  patientCpf: '',
  historyFilter: '',
  resultsSaved: false,
};

function resetFlow(scaleKey){
  const scale = SCALES[scaleKey];
  state.screen = 'flow';
  state.scaleKey = scaleKey;
  state.itemIndex = 0;
  state.answers = scale.items.map(it => it.groups.map(() => null));
  state.resultsSaved = false;
}

function maskCPF(value){
  const digits = String(value || '').replace(/\D/g, '').slice(0, 11);
  if (digits.length > 9) return digits.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/, '$1.$2.$3-$4');
  if (digits.length > 6) return digits.replace(/(\d{3})(\d{3})(\d{1,3})/, '$1.$2.$3');
  if (digits.length > 3) return digits.replace(/(\d{3})(\d{1,3})/, '$1.$2');
  return digits;
}

function isValidCPF(value){
  const d = String(value || '').replace(/\D/g, '');
  if (d.length !== 11 || /^(\d)\1{10}$/.test(d)) return false;
  const check = (len) => {
    let sum = 0;
    for (let i = 0; i < len; i++) sum += parseInt(d[i], 10) * (len + 1 - i);
    const r = (sum * 10) % 11;
    return r === 10 ? 0 : r;
  };
  return check(9) === parseInt(d[9], 10) && check(10) === parseInt(d[10], 10);
}

function requirePatientInfo(){
  const name = (state.patientName || '').trim();
  let ok = true;

  if (!name) {
    const input = document.getElementById('patientNameInput');
    if (input) { input.classList.add('input-error'); input.focus(); }
    ok = false;
  }
  if (!isValidCPF(state.patientCpf)) {
    const cpfInput = document.getElementById('patientCpfInput');
    const err = document.getElementById('cpfError');
    const incomplete = (state.patientCpf || '').replace(/\D/g, '').length < 11;
    if (cpfInput) { cpfInput.classList.add('input-error'); if (ok) cpfInput.focus(); }
    if (err) {
      err.textContent = incomplete ? 'Digite o CPF completo.' : 'CPF inválido. Confira os números.';
      err.classList.add('show');
    }
    ok = false;
  }
  return ok;
}

function goHome(){
  state.screen = 'home';
  state.scaleKey = null;
  render();
}

function currentScale(){ return SCALES[state.scaleKey]; }

function selectOption(groupIdx, optIdx){
  const scale = currentScale();
  const item = scale.items[state.itemIndex];
  state.answers[state.itemIndex][groupIdx] = item.groups[groupIdx].options[optIdx].value;

  const allAnswered = state.answers[state.itemIndex].every(v => v !== null);
  const singleGroup = item.groups.length === 1;

  if (singleGroup && allAnswered) {
    advance();
  } else {
    render();
  }
}

function advance(){
  const scale = currentScale();
  if (state.itemIndex < scale.items.length - 1) {
    state.itemIndex += 1;
    render();
  } else {
    state.screen = 'results';
    render();
  }
}

function goBackItem(){
  if (state.itemIndex > 0) {
    state.itemIndex -= 1;
    render();
  } else {
    goHome();
  }
}

/* ================= RENDER ================= */
function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  if (state.screen === 'home') app.appendChild(renderHome());
  else if (state.screen === 'flow') app.appendChild(renderFlow());
  else if (state.screen === 'results') app.appendChild(renderResults());
  else if (state.screen === 'history') app.appendChild(renderHistory());
}

function el(tag, cls, html){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}

function renderHome(){
  const wrap = el('div');
  const head = el('div', 'home-head');
  head.appendChild(el('h1', null, 'Avaliação de marcha e equilíbrio'));
  head.appendChild(el('p', null, 'Escolha o instrumento. As perguntas aparecem uma de cada vez e a pontuação é calculada automaticamente ao final.'));
  wrap.appendChild(head);

  const patientBox = el('div', 'patient-box');

  const fieldsRow = el('div', 'patient-fields-row');

  const nameField = el('div', 'patient-field');
  const nameLabel = document.createElement('label');
  nameLabel.className = 'patient-label';
  nameLabel.htmlFor = 'patientNameInput';
  nameLabel.textContent = 'Nome do paciente';
  nameField.appendChild(nameLabel);
  const nameInput = document.createElement('input');
  nameInput.type = 'text';
  nameInput.id = 'patientNameInput';
  nameInput.className = 'patient-input';
  nameInput.placeholder = 'Nome completo';
  nameInput.value = state.patientName || '';
  nameInput.oninput = (e) => {
    state.patientName = e.target.value;
    nameInput.classList.remove('input-error');
  };
  nameField.appendChild(nameInput);
  fieldsRow.appendChild(nameField);

  const cpfField = el('div', 'patient-field patient-field-cpf');
  const cpfLabel = document.createElement('label');
  cpfLabel.className = 'patient-label';
  cpfLabel.htmlFor = 'patientCpfInput';
  cpfLabel.textContent = 'CPF';
  cpfField.appendChild(cpfLabel);
  const cpfInput = document.createElement('input');
  cpfInput.type = 'text';
  cpfInput.id = 'patientCpfInput';
  cpfInput.className = 'patient-input';
  cpfInput.placeholder = '000.000.000-00';
  cpfInput.inputMode = 'numeric';
  cpfInput.maxLength = 14;
  cpfInput.value = state.patientCpf || '';
  const cpfError = el('div', 'field-error', 'CPF inválido. Confira os números.');
  cpfError.id = 'cpfError';
  cpfInput.oninput = (e) => {
    const masked = maskCPF(e.target.value);
    e.target.value = masked;
    state.patientCpf = masked;
    const bad = masked.replace(/\D/g, '').length === 11 && !isValidCPF(masked);
    cpfInput.classList.toggle('input-error', bad);
    cpfError.textContent = 'CPF inválido. Confira os números.';
    cpfError.classList.toggle('show', bad);
  };
  cpfField.appendChild(cpfInput);
  cpfField.appendChild(cpfError);
  fieldsRow.appendChild(cpfField);

  patientBox.appendChild(fieldsRow);

  const footer = el('div', 'patient-box-footer');
  footer.appendChild(el('div', 'patient-hint', 'Nome e CPF identificam o paciente (o CPF é conferido pelos dígitos verificadores). No histórico ficam salvos só os 2 últimos dígitos.'));
  const histBtn = el('button', 'link-btn history-link', 'Ver histórico');
  histBtn.onclick = () => { state.screen = 'history'; render(); };
  footer.appendChild(histBtn);
  patientBox.appendChild(footer);

  wrap.appendChild(patientBox);

  const grid = el('div', 'scale-grid');

  const dgiCard = el('button', 'scale-card');

  dgiCard.appendChild(el('div', 'desc', DGI.desc));

  grid.appendChild(dgiCard);

  const tinettiCard = el('button', 'scale-card');
  tinettiCard.appendChild(el('h2', null, TINETTI.title));
  tinettiCard.appendChild(el('div', 'meta', TINETTI.meta));
  tinettiCard.appendChild(el('div', 'desc', TINETTI.desc));
  tinettiCard.onclick = () => { if (!requirePatientInfo()) return; resetFlow('tinetti'); render(); };
  grid.appendChild(tinettiCard);

  const bergCard = el('button', 'scale-card');
  bergCard.appendChild(el('h2', null, BERG.title));
  bergCard.appendChild(el('div', 'meta', BERG.meta));
  bergCard.appendChild(el('div', 'desc', BERG.desc));
  bergCard.onclick = () => { if (!requirePatientInfo()) return; resetFlow('berg'); render(); };
  grid.appendChild(bergCard);

  wrap.appendChild(grid);
  return wrap;
}

function renderFlow(){
  const scale = currentScale();
  const item = scale.items[state.itemIndex];
  const wrap = el('div');

  const top = el('div', 'flow-top');
  top.appendChild(el('div', 'flow-title', scale.title));
  top.appendChild(el('div', 'flow-count', `Item ${state.itemIndex + 1} de ${scale.items.length}`));
  wrap.appendChild(top);

  const track = el('div', 'progress-track');
  const fill = el('div', 'progress-fill');
  fill.style.width = `${((state.itemIndex) / scale.items.length) * 100}%`;
  track.appendChild(fill);
  wrap.appendChild(track);

  const card = el('div', 'q-card');
  if (item.section) {
    const tag = item.section === 'equilibrio' ? 'EQUILÍBRIO' : 'MARCHA';
    card.appendChild(el('div', 'q-section-tag', tag));
  }
  card.appendChild(el('div', 'q-name', item.name));
  if (item.instructions) card.appendChild(el('div', 'q-instructions', item.instructions));

  item.groups.forEach((group, gIdx) => {
    const block = el('div', 'group-block');
    if (group.label) block.appendChild(el('div', 'group-label', group.label));

    const isBinary = group.options.length === 2;
    const optsWrap = el('div', isBinary ? 'options binary-row' : 'options');

    group.options.forEach((opt, oIdx) => {
      const selectedVal = state.answers[state.itemIndex][gIdx];
      const btn = el('button', 'opt-btn' +
        (selectedVal === opt.value ? ' selected' : '') +
        (opt.value === 0 ? ' sev-0' : (opt.value === 1 && group.options.length > 2 ? ' sev-1' : '')));
      btn.appendChild(el('div', 'opt-label', opt.label));
      if (opt.desc) btn.appendChild(el('div', 'opt-desc', opt.desc));
      btn.onclick = () => selectOption(gIdx, oIdx);
      optsWrap.appendChild(btn);
    });
    block.appendChild(optsWrap);
    card.appendChild(block);
  });

  wrap.appendChild(card);

  const actions = el('div', 'flow-actions');
  const back = el('button', 'link-btn', state.itemIndex === 0 ? 'Voltar ao menu' : 'Item anterior');
  back.onclick = goBackItem;
  actions.appendChild(back);

  if (item.groups.length > 1) {
    const allAnswered = state.answers[state.itemIndex].every(v => v !== null);
    const cont = el('button', 'primary-btn', state.itemIndex === scale.items.length - 1 ? 'Ver resultado' : 'Próximo item');
    cont.disabled = !allAnswered;
    cont.onclick = advance;
    actions.appendChild(cont);
  }

  wrap.appendChild(actions);
  return wrap;
}

function renderResults(){
  const scale = currentScale();
  const wrap = el('div');

  const top = el('div', 'flow-top');
  top.appendChild(el('div', 'flow-title', scale.title));
  wrap.appendChild(top);

  const card = el('div', 'results-card');
  card.appendChild(el('h2', null, 'Resultado'));

  const total = scale.items.reduce((sum, it, idx) =>
    sum + state.answers[idx].reduce((s, v) => s + (v || 0), 0), 0);

  const breakdown = scale.items.map((it, idx) => {
    const itemScore = state.answers[idx].reduce((s, v) => s + (v || 0), 0);
    const itemMax = it.groups.reduce((s, g) => s + Math.max(...g.options.map(o => o.value)), 0);
    return { name: it.name, score: itemScore, max: itemMax };
  });

  if (!state.resultsSaved) {
    state.resultsSaved = true;
    const extra = {};
    if (scale.key === 'tinetti') {
      extra.subScores = {
        equilibrio: scale.items.reduce((sum, it, idx) => it.section === 'equilibrio'
          ? sum + state.answers[idx].reduce((s, v) => s + (v || 0), 0) : sum, 0),
        marcha: scale.items.reduce((sum, it, idx) => it.section === 'marcha'
          ? sum + state.answers[idx].reduce((s, v) => s + (v || 0), 0) : sum, 0),
      };
    }
    saveAssessment(scale, total, scale.maxScore, breakdown, extra);
  }

  if (scale.key === 'tinetti') {
    const eq = scale.items.reduce((sum, it, idx) => it.section === 'equilibrio'
      ? sum + state.answers[idx].reduce((s, v) => s + (v || 0), 0) : sum, 0);
    const ma = scale.items.reduce((sum, it, idx) => it.section === 'marcha'
      ? sum + state.answers[idx].reduce((s, v) => s + (v || 0), 0) : sum, 0);

    const subtotals = el('div', 'subtotals');
    const s1 = el('div', 'subtotal-item');
    s1.appendChild(el('div', 'n', `${eq}/16`));
    s1.appendChild(el('div', 'l', 'Equilíbrio'));
    const s2 = el('div', 'subtotal-item');
    s2.appendChild(el('div', 'n', `${ma}/12`));
    s2.appendChild(el('div', 'l', 'Marcha'));
    subtotals.appendChild(s1);
    subtotals.appendChild(s2);

    const scoreRow = el('div', 'score-row');
    scoreRow.appendChild(el('div', 'sub-label', 'Pontuação total'));
    scoreRow.appendChild(el('div', 'big', total));
    scoreRow.appendChild(el('div', 'of', '/ 28'));
    card.appendChild(scoreRow);
    card.appendChild(subtotals);

    const note = el('div', 'note-box',
      `Segundo o instrumento (Cadernos de Atenção Básica), quanto menor a pontuação, maior o comprometimento — escores abaixo de 19 indicam risco de queda cerca de 5 vezes maior. ${total < 19 ? 'O resultado desta avaliação está abaixo desse ponto de corte.' : 'O resultado desta avaliação está acima desse ponto de corte.'}`);
    card.appendChild(note);
  } else if (scale.key === 'berg') {
    const scoreRow = el('div', 'score-row');
    scoreRow.appendChild(el('div', 'sub-label', 'Pontuação total'));
    scoreRow.appendChild(el('div', 'big', total));
    scoreRow.appendChild(el('div', 'of', `/ ${scale.maxScore}`));
    card.appendChild(scoreRow);

    let faixa;
    if (total >= 54) faixa = 'nenhuma limitação de equilíbrio (54–56)';
    else if (total >= 43) faixa = 'limitação leve (43–53)';
    else if (total >= 29) faixa = 'limitação moderada (29–42)';
    else if (total >= 4) faixa = 'limitação grave (4–28)';
    else faixa = 'limitação completa (0–3)';

    const note = el('div', 'note-box',
      `Pela classificação da escala (Miyamoto et al., 2004), esta pontuação corresponde a: ${faixa}.`);
    card.appendChild(note);
  } else {
    const scoreRow = el('div', 'score-row');
    scoreRow.appendChild(el('div', 'sub-label', 'Pontuação total'));
    scoreRow.appendChild(el('div', 'big', total));
    scoreRow.appendChild(el('div', 'of', `/ ${scale.maxScore}`));
    card.appendChild(scoreRow);

    const note = el('div', 'note-box',
      'Quanto menor a pontuação, maior o comprometimento da marcha diante das exigências testadas (velocidade, movimentos de cabeça, obstáculos, giro e degraus).');
    card.appendChild(note);
  }

  const details = el('details', 'item-breakdown');
  details.appendChild(el('summary', null, 'Ver pontuação item a item'));
  scale.items.forEach((it, idx) => {
    const row = el('div', 'item-row');
    const itemScore = state.answers[idx].reduce((s, v) => s + (v || 0), 0);
    const itemMax = it.groups.reduce((s, g) => s + Math.max(...g.options.map(o => o.value)), 0);
    row.appendChild(el('div', 'name', it.name));
    row.appendChild(el('div', 'val', `${itemScore} / ${itemMax}`));
    details.appendChild(row);
  });
  card.appendChild(details);

  const actions = el('div', 'results-actions');
  const restart = el('button', 'ghost-btn', 'Refazer esta escala');
  restart.onclick = () => { resetFlow(scale.key); render(); };
  const menu = el('button', 'ghost-btn', 'Escolher outra escala');
  menu.onclick = goHome;
  actions.appendChild(restart);
  actions.appendChild(menu);
  card.appendChild(actions);

  wrap.appendChild(card);
  return wrap;
}

/* ================= HISTÓRICO (persistência local) ================= */
const STORAGE_KEY = 'avaliacaoMarchaEquilibrio_historico_v1';

function cpfFinalOf(r){
  if (r && r.patientCpfFinal) return String(r.patientCpfFinal);
  const d = String((r && r.patientCpf) || '').replace(/\D/g, '');
  return d ? d.slice(-2) : '';
}

function cpfMasked(r){
  const f = cpfFinalOf(r);
  return f ? '***.***.***-' + f : '—';
}

function sanitizeRecord(r){
  const out = Object.assign({}, r);
  out.patientCpfFinal = cpfFinalOf(r);
  delete out.patientCpf;
  return out;
}

function loadAllAssessments(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    const list = raw ? JSON.parse(raw) : [];
    if (list.some(r => r && r.patientCpf)) {
      const clean = list.map(sanitizeRecord);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(clean));
      return clean;
    }
    return list;
  } catch (e) {
    return null; // localStorage indisponível/bloqueado
  }
}

function saveAssessment(scale, total, maxScore, breakdown, extra){
  const record = Object.assign({
    id: 'a_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8),
    patientName: (state.patientName || '').trim() || 'Sem nome',
    patientCpfFinal: (state.patientCpf || '').replace(/\D/g, '').slice(-2),
    scaleKey: scale.key,
    scaleTitle: scale.title,
    total: total,
    maxScore: maxScore,
    timestamp: Date.now(),
    breakdown: breakdown,
  }, extra || {});

  try {
    const all = loadAllAssessments() || [];
    all.push(record);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(all));
  } catch (e) {
    console.error('Não foi possível salvar no histórico local:', e);
  }
}

let historyCache = [];

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, s => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[s]));
}

/* ---------- exportar / importar (para compartilhar o histórico) ---------- */
function downloadFile(filename, content, mime){
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function todayStamp(){
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}

function exportHistoryJson(statusEl){
  const all = loadAllAssessments();
  if (!all || all.length === 0) { statusEl.textContent = 'Não há avaliações para exportar.'; return; }
  const payload = {
    versao: 1,
    exportadoEm: new Date().toISOString(),
    avaliacoes: all.map(sanitizeRecord),
  };
  downloadFile('historico-avaliacoes-' + todayStamp() + '.json', JSON.stringify(payload, null, 2), 'application/json');
  statusEl.textContent = 'Arquivo .json gerado. Para ver em outro computador, use "Importar histórico" lá.';
}

function exportHistoryCsv(statusEl){
  const all = loadAllAssessments();
  if (!all || all.length === 0) { statusEl.textContent = 'Não há avaliações para exportar.'; return; }
  const q = v => '"' + String(v === undefined || v === null ? '' : v).replace(/"/g, '""') + '"';
  const p = n => String(n).padStart(2, '0');
  const rows = [['Data', 'Hora', 'Paciente', 'CPF', 'Escala', 'Pontuação', 'Máximo']];
  all.slice().sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0)).forEach(r => {
    const d = new Date(r.timestamp || 0);
    rows.push([
      p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + d.getFullYear(),
      p(d.getHours()) + ':' + p(d.getMinutes()),
      r.patientName, cpfMasked(r), r.scaleTitle, r.total, r.maxScore,
    ]);
  });
  const csv = '\ufeff' + rows.map(row => row.map(q).join(';')).join('\r\n');
  downloadFile('historico-avaliacoes-' + todayStamp() + '.csv', csv, 'text/csv;charset=utf-8');
  statusEl.textContent = 'Planilha .csv gerada (abre direto no Excel).';
}

function importHistory(file, onDone){
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      const list = Array.isArray(data) ? data : data.avaliacoes;
      if (!Array.isArray(list)) throw new Error('formato');
      const current = loadAllAssessments() || [];
      const ids = new Set(current.map(r => r.id));
      let added = 0;
      list.forEach(r => {
        if (r && r.id && !ids.has(r.id)) { current.push(sanitizeRecord(r)); ids.add(r.id); added++; }
      });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(current));
      onDone(added + (added === 1 ? ' avaliação importada.' : ' avaliações importadas.'));
    } catch (e) {
      onDone('Não foi possível ler esse arquivo. Use um .json exportado por esta ferramenta.');
    }
  };
  reader.readAsText(file);
}

function renderHistory(){
  const wrap = el('div');

  const top = el('div', 'flow-top');
  top.appendChild(el('div', 'flow-title', 'Histórico de avaliações'));
  const back = el('button', 'link-btn', 'Voltar');
  back.onclick = goHome;
  top.appendChild(back);
  wrap.appendChild(top);

  const statusEl = el('div', 'history-status', '');

  const actions = el('div', 'history-actions');
  const btnJson = el('button', 'ghost-btn', 'Exportar histórico (.json)');
  btnJson.onclick = () => exportHistoryJson(statusEl);
  actions.appendChild(btnJson);
  const btnCsv = el('button', 'ghost-btn', 'Exportar planilha (.csv)');
  btnCsv.onclick = () => exportHistoryCsv(statusEl);
  actions.appendChild(btnCsv);
  const btnImp = el('button', 'ghost-btn', 'Importar histórico');
  const fileInput = document.createElement('input');
  fileInput.type = 'file';
  fileInput.id = 'importFileInput';
  fileInput.accept = '.json,application/json';
  fileInput.style.display = 'none';
  fileInput.onchange = () => {
    const f = fileInput.files && fileInput.files[0];
    if (f) importHistory(f, (msg) => { statusEl.textContent = msg; refreshList(); });
    fileInput.value = '';
  };
  btnImp.onclick = () => fileInput.click();
  actions.appendChild(btnImp);
  actions.appendChild(fileInput);
  wrap.appendChild(actions);
  wrap.appendChild(statusEl);

  const filterRow = el('div', 'history-filter-row');
  const filterInput = document.createElement('input');
  filterInput.type = 'text';
  filterInput.className = 'patient-input';
  filterInput.placeholder = 'Filtrar por nome ou final do CPF';
  filterInput.value = state.historyFilter || '';
  filterInput.oninput = (e) => {
    state.historyFilter = e.target.value;
    renderHistoryList(listEl);
  };
  filterRow.appendChild(filterInput);
  wrap.appendChild(filterRow);

  const card = el('div', 'results-card history-card');
  const listEl = el('div', 'history-list');
  card.appendChild(listEl);
  wrap.appendChild(card);

  function refreshList(){
    const loaded = loadAllAssessments();
    if (loaded === null) {
      listEl.innerHTML = '';
      listEl.appendChild(el('div', 'history-empty', 'Este navegador bloqueou o armazenamento local — não é possível ler o histórico aqui.'));
      return;
    }
    historyCache = loaded.slice().sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
    renderHistoryList(listEl);
  }
  refreshList();
  return wrap;
}

function renderHistoryList(listEl){
  listEl.innerHTML = '';
  const filter = (state.historyFilter || '').trim().toLowerCase();
  const filterDigits = filter.replace(/\D/g, '');

  const items = historyCache.filter(r => {
    if (!filter) return true;
    const nameMatch = String(r.patientName || '').toLowerCase().includes(filter);
    const cpfMatch = filterDigits && cpfFinalOf(r).includes(filterDigits.slice(-2));
    return nameMatch || cpfMatch;
  });

  if (items.length === 0) {
    listEl.appendChild(el('div', 'history-empty', historyCache.length === 0
      ? 'Nenhuma avaliação salva ainda neste navegador.'
      : 'Nenhuma avaliação encontrada para esse nome ou CPF.'));
    return;
  }

  items.forEach(r => {
    const row = el('div', 'history-item');
    const date = r.timestamp ? new Date(r.timestamp).toLocaleDateString('pt-BR') : '';
    row.appendChild(el('div', 'history-item-main',
      `<strong>${escapeHtml(r.patientName || 'Sem nome')}</strong> — CPF ${escapeHtml(cpfMasked(r))} · ${escapeHtml(r.scaleTitle || '')}`));
    row.appendChild(el('div', 'history-item-meta', `${date} · ${r.total}/${r.maxScore}`));
    listEl.appendChild(row);
  });
}

render();
